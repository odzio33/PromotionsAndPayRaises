services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: payraisemodule
      POSTGRES_USER: payraisemodule
      POSTGRES_PASSWORD: payraisemodule
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payraisemodule"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    ports:
      - "8081:8081"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: payraisemodule
      DB_USERNAME: payraisemodule
      DB_PASSWORD: payraisemodule
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  postgres-data:
